<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Face Modal — Standalone Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #050810; color: #cde; font-family: 'IBM Plex Mono', monospace;
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
  }
  .panel {
    width: 440px; max-width: 92vw; background: rgba(15,22,40,0.92);
    border: 1px solid rgba(0,240,255,0.25); border-radius: 14px; padding: 20px;
    text-align: center;
  }
  .panel h2 { font-size: 15px; letter-spacing: 1px; text-transform: uppercase; color: #00f0ff; }
  .vid-wrap {
    position: relative; width: 400px; height: 300px; max-width: 100%; margin: 14px auto;
    border-radius: 12px; overflow: hidden; background: #000; border: 3px solid rgba(0,240,255,0.3);
  }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .msg { font-size: 12px; min-height: 20px; margin-bottom: 12px; color: #ffcc33; }
  .btn-capture {
    width: 100%; padding: 16px; font-size: 16px; font-weight: 800; border-radius: 10px;
    cursor: pointer; border: none; letter-spacing: 1.5px; text-transform: uppercase;
    background: linear-gradient(135deg, #00f0ff, #0066ff); color: #001018;
    box-shadow: 0 0 24px rgba(0,240,255,0.45);
  }
  .btn-skip {
    width: 100%; margin-top: 12px; padding: 10px; font-size: 12px; font-weight: 600;
    border-radius: 8px; cursor: pointer; letter-spacing: 0.5px;
    background: transparent; border: 1px solid rgba(255,255,255,0.15); color: #89a;
    transition: all 0.2s;
  }
  .btn-skip:hover { color: #00f0ff; border-color: #00f0ff; }
  .done { font-size: 40px; color: #00ff9d; margin: 40px 0; }
</style>
</head>
<body>
<div class="panel" id="app">
  <h2>👤 Face Enrollment (Standalone Test)</h2>
  <div class="vid-wrap">
    <video id="cam" autoplay playsinline muted></video>
  </div>
  <div class="msg" id="msg">Starting camera…</div>
  <button class="btn-capture" id="capture">📸 CAPTURE</button>
  <button class="btn-skip" id="skip">Skip face enrollment for now →</button>
</div>

<script>
  const msg = document.getElementById('msg');
  const captureBtn = document.getElementById('capture');
  const skipBtn = document.getElementById('skip');
  const video = document.getElementById('cam');
  const app = document.getElementById('app');
  let stream = null;

  (async () => {
    try {
      msg.textContent = 'Requesting camera…';
      stream = await navigator.mediaDevices.getUserMedia({ video: { width: 480, height: 360 } });
      video.srcObject = stream;
      msg.textContent = 'Camera live ✓ — both buttons are visible below';
      msg.style.color = '#00ff9d';
    } catch (e) {
      msg.textContent = 'Camera error: ' + e.message + ' — use http://localhost:5174/facetest.html';
      msg.style.color = '#ff3860';
    }
  })();

  captureBtn.addEventListener('click', () => {
    app.innerHTML = '<h2>👤 Face Enrollment</h2><div class="done">✓<br>Capture works!</div><button class="btn-skip" onclick="location.reload()">Test again</button>';
  });

  skipBtn.addEventListener('click', () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
    app.innerHTML = '<h2>👤 Face Enrollment</h2><div class="done">✓<br>Skip works!</div><button class="btn-skip" onclick="location.reload()">Test again</button>';
  });
</script>
</body>
</html>
