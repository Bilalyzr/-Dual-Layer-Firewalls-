# Render Blueprint — deploys the proxy + engine as two free web services.
# Docs: https://render.com/docs/blueprint-spec
#
# After the first deploy, Render keeps these in sync with this file on push.
# Both services auto-deploy from the `main` branch.
#
# IMPORTANT: set the env vars marked "set in dashboard" in the Render UI
# (Secrets) — never commit real keys. See DEPLOY.md.

services:
  # ---- Python engine: scikit-learn classifier + LSTM/ensemble + SHAP ----
  - type: web
    name: dlf-engine
    runtime: docker
    plan: free
    region: oregon            # change to frankfurt/singapore if closer
    dockerfilePath: ./engine/Dockerfile
    dockerContext: ./engine
    healthCheckPath: /health
    # The engine trains both models at build time (Dockerfile RUN step), so no
    # extra env needed for the model artifacts. Expose the port Render assigns.
    envVars:
      - key: PORT
        value: 8011
      - key: uvicorn
        sync: false
    # Render injects PORT; we read it in the Dockerfile CMD via $PORT.
    # The engine Dockerfile already listens on 8011; Render maps it automatically.

  # ---- Node.js proxy: the AI Firewall gateway ----
  - type: web
    name: dlf-proxy
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./proxy/Dockerfile
    dockerContext: ./proxy
    healthCheckPath: /api/alerts/status
    envVars:
      - key: PROXY_PORT
        value: 4000
      # The engine's Render URL — set this AFTER the engine deploys (see DEPLOY.md).
      - key: ENGINE_URL
        sync: false
      # MongoDB Atlas connection string — set in dashboard (Secret).
      - key: MONGO_URI
        sync: false
      # ---- LLM backend: Gemini via its OpenAI-compatible endpoint ----
      # Free key from https://aistudio.google.com/apikey (Google account, no
      # card). Globally reachable — works from Render's US datacenters AND
      # local dev, unlike the GLM China endpoint. Paste the Gemini key into
      # the LLM_API_KEY secret in the Render dashboard.
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: LLM_API_KEY
        sync: false
      - key: LLM_TIMEOUT_MS
        value: "12000"
      # ---- Hosted LLM fallback (RECOMMENDED — see DEPLOY.md) ----
      # open.bigmodel.cn is often unreachable from Render's US datacenters; a
      # free Groq key gives the live site a fast, always-reachable fallback.
      # 1) create a free key at console.groq.com
      # 2) set these three in the Render dashboard (Secrets):
      #      LLM_FALLBACK_URL      = https://api.groq.com/openai/v1
      #      LLM_FALLBACK_MODEL    = llama-3.1-8b-instant
      #      LLM_FALLBACK_API_KEY  = gsk_...
      - key: LLM_FALLBACK_URL
        sync: false
      - key: LLM_FALLBACK_MODEL
        sync: false
      - key: LLM_FALLBACK_API_KEY
        sync: false
      # Keep dlf-engine from idle-sleeping: Render free sleeps services after
      # ~15 min without traffic; the engine's ~50s cold start then shows to
      # visitors as "engine offline" / n-a metrics. A /health ping every 10
      # minutes keeps it resident while the proxy itself is awake.
      - key: ENGINE_KEEPALIVE_MS
        value: "600000"
      # ---- Firewall modes ----
      - key: FIREWALL_MODE
        value: enforce
      - key: FIREWALL_THRESHOLD
        value: "0.65"
      - key: BIOMETRIC_MODE
        value: shadow
      # open.bigmodel.cn is unreachable from Render's US datacenters. Until a
      # hosted fallback key is set (LLM_FALLBACK_* above, e.g. free Groq),
      # STRICT_REAL=false lets live chat answer via the built-in offline
      # responder instead of returning 502 — the firewall verdicts are real
      # either way; only the answer text is the demo responder.
      - key: STRICT_REAL
        value: "false"
      # ---- Session secret (set in dashboard as a Secret) ----
      - key: SESSION_SECRET
        sync: false
