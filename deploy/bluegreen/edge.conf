# Managed by scripts/deploy-bluegreen.sh — DO NOT EDIT BY HAND.
# Active color: blue
server {
  listen 80;

  # Site API → active proxy color
  location /api/ {
    proxy_pass http://dlf-green-proxy:4001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # v2 firewall API under /v2/ — the firewall's chat endpoint lives at
  # /v1/chat/completions, everything else at its bare path (/health,
  # /sentiment/score, /metrics…).
  location = /v2/chat/completions {
    proxy_pass http://dlf-green-firewall:8020/v1/chat/completions;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }
  location /v2/ {
    rewrite ^/v2/(.*)$ /$1 break;
    proxy_pass http://dlf-green-firewall:8020;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  # Health probe for the deploy script + monitoring
  location /edge-health {
    access_log off;
    return 200 "edge-ok color=green\n";
  }
}
