# EPIC J — default values for the Helm chart.
# Override per-environment with -f values.prod.yaml or --set.

image:
  registry: ""
  pullPolicy: IfNotPresent

# Per-service config: replicas, resources, autoscaling.
proxy:
  replicas: 2
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "512Mi" }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    cpuUtilization: 70

engine:
  replicas: 1
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "1000m", memory: "1Gi" }

client:
  replicas: 2

# A PodDisruptionBudget keeps the service available during node drains.
pdb:
  enabled: true
  minAvailable: 1

# All secrets come from a pre-created Secret (never in values.yaml).
existingSecret: dlf-secrets

# Ingress (optional — set enabled + host for a public endpoint).
ingress:
  enabled: false
  className: nginx
  host: firewall.example.com
  tls: true
